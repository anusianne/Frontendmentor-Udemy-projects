<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="bmiCalculator.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="heading">Body Mass Index (BMI) Calculator</h1>
      <div class="bmiInput">
        <label for="height">Your Height (cm): </label>
        <input type="number" id="height" name="height" value="180" />
      </div>
      <div class="bmiInput">
        <label for="weight">Your weight (kg): </label>
        <input type="number" id="weight" name="weight" value="80" />
      </div>
      <button class="btn" id="btn">Compute BMI</button>
      <div class="bmiInput">
        <label for="bmi">Your BMI: </label>
        <input type="text" id="bmi" disabled />
        <h4 class="info-text">
          Weight condition: <span id="weight-condition"></span>
        </h4>
      </div>
    </div>

    <script src="bmiCalculator.js"></script>
  </body>
</html>
