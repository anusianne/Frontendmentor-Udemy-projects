<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="temperatureConverter.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="heading">Temperature Converter</h1>
      <div class="temperatureContainer">
        <label for="celcius" name="celcius">Celcius:</label>
        <input type="number" id="celcius" class="input" />
      </div>
      <div class="temperatureContainer">
        <label for="fehrenheit" name="fehrenheit">Fahrenheit:</label>
        <input type="number" id="fahrenheit" class="input" />
      </div>
      <div class="temperatureContainer">
        <label for="kelvin" name="kelvin">Kelvin:</label>
        <input type="number" id="kelvin" class="input" />
      </div>
    </div>

    <script src="temperatureConverter.js"></script>
  </body>
</html>
