<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="temperatureConverter.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="heading">Temperature Converter</h1>

      <div class="temperatureContainer">
        <label for="celsius">Celsius:</label>
        <input type="number" id="celsius" class="input" name="celsius" />
      </div>

      <div class="temperatureContainer">
        <label for="fahrenheit">Fahrenheit:</label>
        <input type="number" id="fahrenheit" class="input" name="fahrenheit" />
      </div>

      <div class="temperatureContainer">
        <label for="kelvin">Kelvin:</label>
        <input type="number" id="kelvin" class="input" name="kelvin" />
      </div>
    </div>

    <script src="temperatureConverter.js"></script>
  </body>
</html>
